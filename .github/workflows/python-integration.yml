name: Python integration smoke tests

on:
  push:
    branches: [main]
    paths:
      - "integration/**"
      - ".github/workflows/python-integration.yml"
  pull_request:
    paths:
      - "integration/**"
      - ".github/workflows/python-integration.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check syntax
        run: python -m compileall -q integration
      - name: Run deterministic smoke suite
        run: python -m unittest discover -s integration/tests -p 'test_imported_theta.py' -v
